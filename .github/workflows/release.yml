name: Release

# On main: test -> bump version + tag + GitHub release -> build -> PyPI -> docs.
# Put "[skip release]" in a commit message to skip the release.
# Requires a PyPI trusted publisher: workflow release.yml, environment pypi.
on:
  push:
    branches: [main]

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  test:
    if: "!contains(github.event.head_commit.message, '[skip release]') && !startsWith(github.event.head_commit.message, 'chore(release)')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: poetry run ruff check . && poetry run mypy .
      - run: poetry run pytest tests -m "not integration"

  version:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write   # push release commit + tag, create release
    outputs:
      tag: ${{ steps.bump.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # Use a PAT here instead if main is protected against GITHUB_TOKEN pushes
          token: ${{ secrets.RELEASE_TOKEN || secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: Bump version, update CHANGELOG, tag
        id: bump
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          npx --yes commit-and-tag-version --no-verify \
            --commitUrlFormat "https://github.com/${{ github.repository }}/commit/{{hash}}" \
            --compareUrlFormat "https://github.com/${{ github.repository }}/compare/{{previousTag}}...{{currentTag}}"
          echo "tag=$(git describe --tags --abbrev=0)" >> "$GITHUB_OUTPUT"
          git push origin HEAD:main --follow-tags
      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG=${{ steps.bump.outputs.tag }}
          awk '/^## \[/{if(p)exit; p=1; next} p' CHANGELOG.md > notes.md
          gh release create "$TAG" --title "$TAG" --notes-file notes.md

  publish:
    needs: version
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with: { ref: "${{ needs.version.outputs.tag }}" }
      - uses: ./.github/actions/setup
      - name: Set version from tag
        run: |
          V="${{ needs.version.outputs.tag }}"; V="${V#v}"
          sed -i -e "0,/0.0.0/s//$V/" pyproject.toml
      - run: poetry build
      - uses: pypa/gh-action-pypi-publish@release/v1

  docs:
    needs: version
    uses: ./.github/workflows/docs.yml
    permissions:
      contents: read
      pages: write
      id-token: write
